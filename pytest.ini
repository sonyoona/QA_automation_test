[pytest]

# 마커 등록 — 등록해야 쓸 수 있는 것은 아니다. 붙이는 것은 등록 없이도 되고,
# 여기 적는 목적은 두 가지다.
#   ① PytestUnknownMarkWarning("is this a typo?") 이 안 뜨게 한다
#   ② 나중에 --strict-markers 를 켤 수 있게 한다 (지금은 안 켰다 — 아래 참고)
markers =
    mutating: 데이터를 변경하는 테스트. 안전한 것만 돌리려면 pytest -m "not mutating"

# conftest.py 의 pytest_collection_modifyitems 가 TC ID 에서 자동 생성하는
# tc_260907 · tc_260907_001 같은 마커는 배포일마다 새로 생겨서 위 목록에 미리 적을 수
# 없다. 그래서 그 이름들의 경고만 골라 끈다 — 메시지 앞부분 매칭이라
# `mutatng` 같은 진짜 오타는 여전히 경고가 뜬다.
filterwarnings =
    ignore:Unknown pytest.mark.tc_:pytest.PytestUnknownMarkWarning

# --strict-markers 를 안 켠 이유 — 켜면 미등록 마커가 경고가 아니라 에러가 되는데,
# 위 tc_* 가 훅에서 붙는 것이라 INTERNALERROR 로 죽는다 (2026-09-09 실측).
# 켜려면 conftest 의 그 훅에서 add_marker 앞에 아래 한 줄을 같이 넣어야 한다.
#     item.config.addinivalue_line("markers", f"tc_{date}: 배포 {date} TC")
# 이 조합으로 --strict-markers 가 통과하는 것까지는 확인했다. 지금 안 켠 것은
# 손으로 붙이는 마커가 mutating 하나뿐이라 오타가 날 자리가 아직 좁기 때문이다.
